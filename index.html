<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Apple Liquid Glass Wallpaper</title>
    <style>
      * {
        box-sizing: border-box;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        cursor: default !important;
      }

      *:focus {
        outline: none !important;
        box-shadow: none;
      }

      html,
      body,
      #canvas-container {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      #webgl-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* Top-Right Hover Zone (Zero UI visible by default) */
      .top-right-hover-zone {
        position: fixed;
        top: 0;
        right: 0;
        padding: 16px 20px;
        z-index: 100;
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        pointer-events: auto;
      }

      /* Inline Settings Bar - Revealed only on top-right hover */
      .top-settings-bar {
        opacity: 0;
        transform: translateY(-6px) scale(0.98);
        pointer-events: none;
        transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 7px 14px;
        background: rgba(18, 18, 24, 0.68);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 9999px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        color: #ffffff;
      }

      .top-right-hover-zone:hover .top-settings-bar,
      .top-settings-bar:focus-within {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      .bar-item {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .bar-label {
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.6);
        white-space: nowrap;
      }

      .bar-select {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 500;
        padding: 5px 8px;
        outline: none;
        cursor: pointer !important;
        transition: all 0.2s;
      }

      .bar-select option {
        background: #1a1a22;
        color: #ffffff;
      }

      .bar-select:hover,
      .bar-select:focus {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .bar-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 80px;
        height: 4px;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 2px;
        outline: none;
        cursor: pointer !important;
      }

      .bar-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        cursor: pointer !important;
        transition: transform 0.15s;
      }

      .bar-slider::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }

      .bar-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        border: none;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        cursor: pointer !important;
      }

      @media (max-width: 768px) {
        .top-right-hover-zone {
          padding: 10px 12px;
        }
        .top-settings-bar {
          gap: 8px;
          padding: 5px 10px;
        }
        .bar-slider {
          width: 60px;
        }
      }
    </style>

    <!-- Embedded font and background asset data for local file:// support -->
    <script src="./fonts_data.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <!-- WebGL Canvas Container -->
    <div id="canvas-container">
      <canvas id="webgl-canvas"></canvas>
    </div>

    <!-- Top-Right Hover Settings Bar -->
    <div class="top-right-hover-zone">
      <div class="top-settings-bar">
        <!-- Font Select -->
        <div class="bar-item">
          <label class="bar-label" for="font-select">Font</label>
          <select id="font-select" class="bar-select">
            <option value="Morganite_Medium" selected>Morganite</option>
            <option value="SixCaps">Six Caps</option>
            <option value="Teko_Bold">Teko</option>
            <option value="BebasNeue">Bebas Neue</option>
            <option value="Antonio_Bold">Antonio</option>
            <option value="BarlowCondensed_Bold">Barlow</option>
            <option value="SairaCondensed_Bold">Saira</option>
            <option value="Oswald_Bold">Oswald</option>
            <option value="SF_Pro_Rounded_Bold">SF Pro</option>
          </select>
        </div>

        <!-- Height Slider -->
        <div class="bar-item">
          <label class="bar-label" id="height-label">Height 100%</label>
          <input
            id="height-slider"
            type="range"
            min="0.60"
            max="1.15"
            step="0.01"
            value="1.00"
            class="bar-slider"
          />
        </div>
      </div>
    </div>

    <!-- Standalone Three.js Logic -->
    <script type="module">
      import * as THREE from "three";
      import { FontLoader } from "three/addons/loaders/FontLoader.js";
      import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      // Font Configurations
      const FONT_CONFIGS = {
        Morganite_Medium: {
          size: 1.2,
          mobileSize: 0.7,
          letterSpacing: -0.005,
          bevelThickness: 0.02,
        },
        SixCaps: {
          size: 1.45,
          mobileSize: 0.85,
          letterSpacing: 0.015,
          bevelThickness: 0.02,
        },
        Teko_Bold: {
          size: 1.35,
          mobileSize: 0.8,
          letterSpacing: 0.01,
          bevelThickness: 0.02,
        },
        BebasNeue: {
          size: 1.15,
          mobileSize: 0.7,
          letterSpacing: 0.02,
          bevelThickness: 0.02,
        },
        Antonio_Bold: {
          size: 1.25,
          mobileSize: 0.75,
          letterSpacing: 0.01,
          bevelThickness: 0.02,
        },
        BarlowCondensed_Bold: {
          size: 1.15,
          mobileSize: 0.7,
          letterSpacing: 0.01,
          bevelThickness: 0.02,
        },
        SairaCondensed_Bold: {
          size: 1.15,
          mobileSize: 0.7,
          letterSpacing: 0.01,
          bevelThickness: 0.02,
        },
        Oswald_Bold: {
          size: 1.05,
          mobileSize: 0.65,
          letterSpacing: 0.01,
          bevelThickness: 0.02,
        },
        SF_Pro_Rounded_Bold: {
          size: 0.95,
          mobileSize: 0.55,
          letterSpacing: 0.01,
          bevelThickness: 0.02,
        },
      };

      // State (Morganite default, bg1 only)
      let currentFontName = "Morganite_Medium";
      let heightScale = 1.0;
      let cornerRoundness = 0.010;
      const parsedFonts = {};
      const pointer = { x: 0, y: 0, targetX: 0, targetY: 0 };
      let lastRenderTime = "";

      // Canvas & Renderer
      const canvas = document.getElementById("webgl-canvas");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      // Scene & Camera
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        5,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );
      camera.position.set(0, 0, 25);
      camera.lookAt(0, 0, 0);

      // Environment for Glass Reflections
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      scene.environment = pmremGenerator.fromScene(
        new RoomEnvironment(),
        0.04
      ).texture;

      // Dynamic Light for Liquid Glass Transmission
      const dirLight = new THREE.DirectionalLight(0xffffff, 8);
      dirLight.position.set(0.4, 1, -0.2);
      scene.add(dirLight);

      // Liquid Glass Physical Material
      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0xffffff),
        roughness: 0.23,
        transmission: 1.0,
        ior: 1.8,
        thickness: 2.0,
        reflectivity: 0.4,
        clearcoat: 0.2,
        clearcoatRoughness: 0.1,
        iridescence: 1.0,
        iridescenceIOR: 0.9,
        iridescenceThicknessRange: [233, 434],
      });

      // Clock Group & Mesh
      const clockGroup = new THREE.Group();
      scene.add(clockGroup);
      let textMesh = null;

      // Background Plane with Aspect Ratio Shader
      const bgMaterial = new THREE.ShaderMaterial({
        uniforms: {
          map: { value: null },
          viewportResolution: {
            value: new THREE.Vector2(window.innerWidth, window.innerHeight),
          },
          imageResolution: { value: new THREE.Vector2(20, 10) },
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec2 vScreenPos;
          void main() {
            vUv = uv;
            vScreenPos = position.xy;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D map;
          uniform vec2 viewportResolution;
          uniform vec2 imageResolution;
          varying vec2 vUv;
          varying vec2 vScreenPos;
          void main() {
            float viewportAspect = viewportResolution.x / viewportResolution.y;
            float imageAspect = imageResolution.x / imageResolution.y;
            vec2 screenUV = (vScreenPos + 1.0) * 0.5;
            float scale;
            vec2 offset = vec2(0.0);
            if (imageAspect > viewportAspect) {
              scale = viewportAspect / imageAspect;
              offset.x = (1.0 - scale) * 0.5;
              screenUV.x = screenUV.x * scale + offset.x;
            } else {
              scale = imageAspect / viewportAspect;
              offset.y = (1.0 - scale) * 0.25;
              screenUV.y = screenUV.y * scale + offset.y;
            }
            screenUV = clamp(screenUV, 0.0, 1.0);
            vec4 texColor = texture2D(map, screenUV);
            vec3 finalColor = mix(texColor.rgb, vec3(0.0, 0.0, 0.0), 0.2);
            gl_FragColor = vec4(finalColor, 1.0);
          }
        `,
        depthWrite: false,
      });

      const bgPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(2.8, 2.8),
        bgMaterial
      );
      bgPlane.position.set(0, 0, -1.5);
      scene.add(bgPlane);

      function updateBgDimensions() {
        const vFov = (camera.fov * Math.PI) / 180;
        const vHeight =
          2 * Math.tan(vFov / 2) * (camera.position.z - bgPlane.position.z);
        const vWidth = vHeight * camera.aspect;
        bgPlane.scale.set(vWidth / 1.3, vHeight / 1.3, 1);
        bgMaterial.uniforms.viewportResolution.value.set(
          window.innerWidth,
          window.innerHeight
        );
      }

      // Background Texture Loading (bg1)
      const textureLoader = new THREE.TextureLoader();
      const bgData = (window.BACKGROUNDS_DATA && window.BACKGROUNDS_DATA.bg1) || "./bg1.jpg";
      textureLoader.load(bgData, (tex) => {
        bgMaterial.uniforms.map.value = tex;
      });

      // Synchronous Font Parsing from FONTS_DATA
      const fontLoader = new FontLoader();
      function getFont(fontName) {
        if (parsedFonts[fontName]) return parsedFonts[fontName];
        if (window.FONTS_DATA && window.FONTS_DATA[fontName]) {
          const parsed = fontLoader.parse(window.FONTS_DATA[fontName]);
          parsedFonts[fontName] = parsed;
          return parsed;
        }
        return null;
      }

      // Time Format & Geometry Update
      function formatTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        return `${hours}:${minutes}`;
      }

      function updateClock() {
        const timeStr = formatTime();
        const fontName = currentFontName;
        const config = FONT_CONFIGS[fontName] || FONT_CONFIGS.Morganite_Medium;
        const isMobile = window.innerWidth < 768;
        const size = isMobile ? config.mobileSize : config.size;

        const font = getFont(fontName);
        if (!font) return;

        const geom = new TextGeometry(timeStr, {
          font: font,
          size: size,
          height: 0.08,
          bevelEnabled: true,
          bevelSize: isMobile ? cornerRoundness * 0.75 : cornerRoundness,
          bevelSegments: 10,
          curveSegments: 16,
          bevelThickness: config.bevelThickness || 0.02,
        });

        geom.center();

        if (textMesh) {
          textMesh.geometry.dispose();
          textMesh.geometry = geom;
        } else {
          textMesh = new THREE.Mesh(geom, glassMaterial);
          clockGroup.add(textMesh);
        }

        clockGroup.scale.set(1, heightScale, 1);
        lastRenderTime = timeStr;
      }

      // Immediate Setup
      updateClock();
      updateBgDimensions();

      // Periodic Clock Check
      setInterval(() => {
        if (formatTime() !== lastRenderTime) {
          updateClock();
        }
      }, 1000);

      // Pointer Interactivity
      window.addEventListener("pointermove", (e) => {
        pointer.targetX = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
      });

      // Resize Handler
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        updateBgDimensions();
        updateClock();
      });

      // UI Listeners
      const fontSelect = document.getElementById("font-select");
      fontSelect.addEventListener("change", (e) => {
        currentFontName = e.target.value;
        updateClock();
      });

      const heightSlider = document.getElementById("height-slider");
      const heightLabel = document.getElementById("height-label");
      heightSlider.addEventListener("input", (e) => {
        heightScale = parseFloat(e.target.value);
        heightLabel.textContent = `Height ${Math.round(heightScale * 100)}%`;
        clockGroup.scale.set(1, heightScale, 1);
      });

      // Render Loop with Damping
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.1);

        // Smoothly interpolate pointer
        pointer.x += (pointer.targetX - pointer.x) * (delta * 6);
        pointer.y += (pointer.targetY - pointer.y) * (delta * 6);

        // Subtle background parallax
        bgPlane.position.x +=
          (-pointer.x * 0.08 - bgPlane.position.x) * (delta * 6);
        bgPlane.position.y +=
          (-pointer.y * 0.05 - bgPlane.position.y) * (delta * 6);

        // Dynamic light tracking through glass
        dirLight.position.x += (pointer.x - dirLight.position.x) * (delta * 6);
        dirLight.position.y += (pointer.y - dirLight.position.y) * (delta * 6);

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
